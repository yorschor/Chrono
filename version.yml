version: 0.11.0.0
default:
  inheritFrom: ''
  dirtyRepo: dirty-repo
  release:
    match:
    - tag::^v.*
    versionSchema: '{major}.{minor}.{patch}'
    newBranchSchema: release/v{major}.{minor}.{patch}
    newTagSchema: v{major}.{minor}.{patch}
    precision: Major
    prereleaseTag: ''
  match: []
  versionSchema: '{major}.{minor}.{patch}.{build}[-]{branch}[.]{commitShortHash}'
  newBranchSchema: ''
  newTagSchema: ''
  precision: Minor
  prereleaseTag: local
branches:
  release:
    match:
    - ^release/.*
    versionSchema: '{major}.{minor}.{patch}-{prereleaseTag}[.]{build}[-]{commitShortHash}'
    newBranchSchema: ''
    newTagSchema: ''
    precision: Patch
    prereleaseTag: rc
