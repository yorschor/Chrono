name: continuous

on: [push]
permissions: 
  contents: read
  actions: read
  checks: write
    
jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:9.0
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh compile
        
  test:
      runs-on: ubuntu-latest
      container:
        image: mcr.microsoft.com/dotnet/sdk:9.0
      steps:
        - uses: actions/checkout@v4
        - run: dotnet test Chrono.slnx --logger trx --results-directory reports
        - uses: EnricoMi/publish-unit-test-result-action@v2
          if: always()
          with:
            files: reports/**/*.trx
