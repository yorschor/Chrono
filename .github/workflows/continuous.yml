name: continuous
 
on: [push]
permissions: 
  contents: read
  actions: read
  checks: write
    
jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:9.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Run compile build script
        run: ./build.sh compile
        
  test:
      runs-on: ubuntu-latest
      container:
        image: mcr.microsoft.com/dotnet/sdk:9.0
      steps:
        - name: Checkout repository
          uses: actions/checkout@v3
        - name: Run tests
          run: dotnet test Chrono.slnx --logger trx --results-directory ./reports
        - name: Test Report
          uses: dorny/test-reporter@v2
          if: success() || failure()
          with:
            name: .NET Tests     
            path: ./reports/*.trx
            reporter: dotnet-trx