name: continuous
 
on: [push]
permissions: 
  contents: read
  actions: read
  checks: write
    
jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:9.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run compile build script
        run: ./build.sh compile
        
  test:
      runs-on: ubuntu-latest
      container:
        image: mcr.microsoft.com/dotnet/sdk:9.0
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        - name: Run tests
          run: dotnet test Chrono.slnx --logger trx --results-directory reports
          
       - name: Publish Test Results
         uses: EnricoMi/publish-unit-test-result-action@v2
         if: always()
         with:
           files: reports/**/*.trx
